manifestVersion: 1
name: "@craftquest/laravel-cloud"
version: "2026.08.12.2"
repository: "https://github.com/CraftQuest/swamp-extensions"
description: "Operate Laravel Cloud from swamp — applications, environments and env vars (values never stored), deploys followed to completion, artisan commands, domains, database clusters with snapshots and restores, caches, object storage, and managed queues. Ships deploy and queue-safe-deploy workflows, a spend report, and an agent skill. Every destructive operation is confirmation-gated. Pure HTTPS, token from your vault."
paths:
  base: manifest
models:
  - apps.ts
  - data.ts
  - queues.ts
workflows:
  - deploy-laravel.yaml
  - safe-deploy.yaml
reports:
  - lc_usage_report.ts
skills:
  - laravel-cloud
additionalFiles:
  - README.md
  - LICENSE.md
  - instances/lc-apps.yaml
  - instances/lc-data.yaml
  - instances/lc-queues.yaml
  - workflow-template.yaml
platforms:
  - darwin-aarch64
  - darwin-x86_64
  - linux-x86_64
  - linux-aarch64
labels:
  - laravel
  - laravel-cloud
  - deployment
  - hosting
