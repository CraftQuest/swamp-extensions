# Workflow template for @craftquest/laravel-cloud
#
# Copy this file into your repo's workflows/ directory as
# workflow-<uuid>.yaml, set id/name, and add your steps. swamp rule: a
# workflow that drives the shipped instances must declare ALL of the
# instance's inputs (the blocks below, with defaults) — your callers then
# only pass the inputs your workflow actually uses.
#
# The blocks below cover lc-apps and the lc-queues-only extras. Driving
# lc-data too? Copy its properties from instances/lc-data.yaml the same
# way (skip any input name already present here).
id: 00000000-0000-0000-0000-000000000000 # replace with any UUID
name: "my-workflow" # your name
description: Describe what your workflow does
version: 1
inputs:
  properties:
    # --- your own workflow inputs go here ---
    # --- lc-apps instance inputs (keep all, defaults included) ---
    app_id:
      type: string
      default: ""
      description: Target application ID
    confirm_app_id:
      type: string
      default: ""
      description: Delete safety gate — must exactly equal app_id
    environment_id:
      type: string
      default: ""
      description: Target environment ID
    confirm_environment_id:
      type: string
      default: ""
      description: Safety gate for delete_environment / stop_environment (unless already stopped)
    deployment_id:
      type: string
      default: ""
      description: Target deployment ID (empty = the stored deployment)
    app_name:
      type: string
      default: ""
      description: Application name for create_app
    repository:
      type: string
      default: ""
      description: Repository for create_app ('owner/name')
    source_control_provider:
      type: string
      default: "github"
      description: github, gitlab, or bitbucket
    region:
      type: string
      default: "us-east-2"
      description: Cloud region for create_app
    root_directory:
      type: string
      default: ""
      description: Monorepo root directory for create_app
    branch:
      type: string
      default: ""
      description: Git branch for create_environment
    environment_name:
      type: string
      default: ""
      description: Environment name for create_environment
    command:
      type: string
      default: ""
      description: Shell/artisan command for run_command
    env_variables:
      type: string
      default: ""
      description: JSON array of {"key","value"} pairs (values are secrets)
    env_var_method:
      type: string
      default: "set"
      description: set (update matching keys) or append
    env_var_keys:
      type: string
      default: ""
      description: JSON array of key names for delete_env_variables
    domain_name:
      type: string
      default: ""
      description: Domain name for create_domain
    domain_id:
      type: string
      default: ""
      description: Target domain ID (verify/delete)
    confirm_domain_id:
      type: string
      default: ""
      description: Delete safety gate — must exactly equal domain_id
    update_payload:
      type: string
      default: ""
      description: JSON object of fields to change (update_* methods)
    avatar_path:
      type: string
      default: ""
      description: Local image path for upload_avatar
    log_query:
      type: string
      default: ""
      description: Search query for get_environment_logs
    log_type:
      type: string
      default: ""
      description: Log type filter (access, application, exception, system)
    metrics_period:
      type: string
      default: ""
      description: Metrics period (API default when empty)
    log_from:
      type: string
      default: ""
      description: Log range start ISO datetime (default one hour ago)
    log_to:
      type: string
      default: ""
      description: Log range end ISO datetime (default now)
    # --- lc-queues-only inputs (drop if you don't drive lc-queues) ---
    instance_id:
      type: string
      default: ""
      description: Target instance ID
    confirm_instance_id:
      type: string
      default: ""
      description: Safety gate for delete_instance and purge_queue — must exactly equal instance_id
    job_id:
      type: string
      default: ""
      description: Target failed-job ID
    confirm_job_id:
      type: string
      default: ""
      description: Delete safety gate — must exactly equal job_id
    process_id:
      type: string
      default: ""
      description: Target background-process ID
    confirm_process_id:
      type: string
      default: ""
      description: Delete safety gate — must exactly equal process_id
    create_payload:
      type: string
      default: ""
      description: JSON object for create_instance / create_background_process
  required: []
jobs:
  - name: main
    description: Your steps
    steps:
      - name: example
        description: Each step calls one model method
        task:
          type: model_method
          modelIdOrName: lc-apps
          methodName: sync_apps
